<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <title>Unsubscribed — Fact-Based Healthcare Decisions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Open Sans', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .logo {
            width: 80px;
            height: auto;
            flex-shrink: 0;
        }

        .header-text h1 {
            font-family: 'Merriweather', serif;
            font-size: 2rem;
            color: #1e4f91;
            margin-bottom: 5px;
        }

        .header-text .tagline {
            font-size: 1.1rem;
            color: #1e4f91;
            font-weight: 600;
        }

        .message-box {
            background-color: #e8f4ea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
        }

        .checkmark {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .message-box h2 {
            font-family: 'Merriweather', serif;
            font-size: 1.6rem;
            color: #1e4f91;
            margin-bottom: 12px;
        }

        .message-box p {
            font-size: 1rem;
            color: #555;
            max-width: 500px;
            margin: 0 auto;
        }

        .contact {
            border-top: 1px solid #ddd;
            padding-top: 30px;
            text-align: center;
        }

        .contact p {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #555;
        }

        .contact a {
            color: #1e4f91;
            text-decoration: none;
            font-weight: 600;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            .header-text h1 { font-size: 1.6rem; }
            .header-text .tagline { font-size: 1rem; }
            .message-box { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="MFHD_LOGO.png" alt="Fact-Based Healthcare Decisions Logo" class="logo">
            <div class="header-text">
                <h1>Fact-Based Healthcare Decisions</h1>
                <p class="tagline">Health insurance guidance for North Carolinians</p>
            </div>
        </header>

        <div class="message-box">
            <div class="checkmark">✓</div>
            <h2>You have been unsubscribed</h2>
            <p>You will no longer receive emails from Fact-Based Healthcare Decisions.</p>
        </div>

        <div class="contact">
            <p>If you unsubscribed by mistake or have questions, contact Kurt Conger directly:</p>
            <a href="mailto:kurt.conger@gmail.com">kurt.conger@gmail.com</a>
        </div>
    </div>
</body>
</html>
